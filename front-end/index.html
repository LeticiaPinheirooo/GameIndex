<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>GameIndex</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <div class="pagina">
        <aside class="painel-formulario">
            <div class="logo-titulo">GameIndex</div>
            <div class="logo-subtitulo">Cadastro de jogos</div>

            <hr class="linha-divisoria">

            <form id="formulario-jogo">
                <div class="grupo-campo">
                    <label class="rotulo-campo">Nome do jogo</label>
                    <input class="campo-texto" type="text" id="campoNome" placeholder="Ex: Katana Zero" required>
                </div>

                <div class="grupo-campo">
                    <label class="rotulo-campo">Data que jogou</label>
                    <input class="campo-data" type="date" id="campoData" required>
                </div>

                <div class="grupo-campo">
                    <label class="rotulo-campo">Plataforma</label>
                    <select class="campo-select" id="campoPlataforma" required>
                        <option selected disabled value="#">Selecione uma plataforma</option>
                    
                    </select>
                </div>

                <div class="grupo-campo">
                    <span class="rotulo-campo">Categoria</span>
                    <div class="grupo-radio">
                        <label class="opcao-radio">
                            <input type="radio" name="categoria" value="Ação">
                            Ação
                        </label>
                        <label class="opcao-radio">
                            <input type="radio" name="categoria" value="Aventura">
                            Aventura
                        </label>
                        <label class="opcao-radio">
                            <input type="radio" name="categoria" value="RPG">
                            RPG
                        </label>
                        <label class="opcao-radio">
                            <input type="radio" name="categoria" value="Puzzle">
                            Puzzle
                        </label>
                        <label class="opcao-radio">
                            <input type="radio" name="categoria" value="História Interativa">
                            História Interativa
                        </label>
                        <label class="opcao-radio">
                            <input type="radio" name="categoria" value="FPS">
                            FPS
                        </label>
                    </div>
                </div>

                <div class="grupo-campo">
                    <label class="opcao-checkbox">
                        <input type="checkbox" id="campoFavorito">
                        Marcar como favorito
                    </label>
                </div>

                <button class="botao-enviar" type="button" onclick="enviar(this)">Salvar jogo</button>
            </form>
        </aside>

        <main class="area-jogos">
            <div class="area-jogos-titulo"><small>Jogos Cadastrados</small></div>

            <p class="lista-vazia" id="mensagem-vazia">Nenhum jogo cadastrado ainda.</p>


            <div class="grade-jogos" id="grade-jogos">
            </div>
        </main>

    </div>

</body>
<script>
    const URL_BASE = "http://localhost:8080/jogos";

    var formulario = document.getElementById('formulario-jogo');
    var gradeJogos = document.getElementById('grade-jogos');
    var msg = document.getElementById('mensagem-vazia');

    var hoje = new Date().toLocaleDateString("pt-BR");
    console.log("[HOJE] " + hoje)

    function formatarHoje(hoje) {
        var [ano, mes, dia] = hoje.split('/');
        return `${dia}-${mes}-${ano}`;
    }


    function formatarData(dataTexto) {
        var [ano, mes, dia] = dataTexto.split('-');
        return `${dia}/${mes}/${ano}`;
    }

    function carregarJogosSalvos(){
        fetch(URL_BASE)
        .then(resposta => {
            if(!resposta.ok){
                throw new Error("Não foi possível buscar jogos.");

            }
            return resposta.json();
        })
        .then(resultado => {
            for(var i = 0; i < resultado.length; i++){
                criarCardRegistro(resultado[i]);
            }
            console.log("[GET realizado para ListarJogos]")
            console.log(resultado); 
        })
        .catch(erro => console.error(erro));
    }

    function validarFormulario() {
        var nome = campoNome.value.trim();
        var data = campoData.value;
        var plataforma = campoPlataforma.value;
        var listaCategorias = document.getElementsByName("categoria");
        var categoriaNome = '';

        var favorito = campoFavorito.checked;

        var selecionado = false;

        if (nome == "") {
            alert("Preencha o nome do jogo.");
            return false;
        }

        if (data == '' || data > formatarHoje(hoje)) {
            console.log("[DATA INVÁLIDA]:")
            console.log("[DATA INFORMADA]" + data)

            alert("Preencha o campo com uma data válida.")
            return false;
        }

        if (plataforma == '#') {
            alert("Selecione uma plataforma válida.")
            return false;
        }

        for (var i = 0; i < listaCategorias.length; i++) {
            if (listaCategorias[i].checked) {
                categoriaNome = listaCategorias[i].value;
                selecionado = true;
                break;
            }
        }

        if (!selecionado) {
            alert("Selecione uma categoria válida.")
            return false;
        }

        var dados = {
            nome,
            data: data,
            plataforma,
            categoriaNome,
            favorito
        }

        return { sucesso: true, dados: dados };

    }


    function carregarPlataformas(){
        fetch(URL_BASE + "/plataformas")
        .then(resposta => {
            if(!resposta.ok){
                throw new Error("Não foi possível listar as plataformas");
            }
            return resposta.json();
        })
        .then(resultado => {
            for(var i = 0; i < resultado.length; i++){
                var option = document.createElement("option");
                option.value = resultado[i].nomePlat;
                option.textContent = resultado[i].nomePlat;
                campoPlataforma.appendChild(option);
            }

            console.log("[GET realizado para plataformas]");
            console.log(resultado);
        })
    }

    function criarCardRegistro(jogo) {
        estrela = '';
        if (jogo.favorito) {
            estrela = `<span class="estrela-favorito">★</span>`
        }

        var card = document.createElement('div');
        card.className = 'card-jogo';
        card.innerHTML = `<div class="card-jogo-nome">
                        ${jogo.nome}
                        ${estrela}
                        </div>

                        <div class="card-jogo-info">Jogado em: ${formatarData(jogo.dataJogou)}</div>
                        <div class="card-jogo-info">Plataforma: ${jogo.plataforma}</div>
                        <div class="card-jogo-info">Categoria: ${jogo.categoria}</div>
            `;

        gradeJogos.appendChild(card);

        msg.style.display = 'none';
    }

    function enviar(botao) {
        var dados = validarFormulario().dados;
        if (!validarFormulario().sucesso) {
            return;

        }

        var novoJogo = {
            nome: dados.nome,
            dataJogou: dados.data,
            plataforma: dados.plataforma,
            categoria: dados.categoriaNome,
            favorito: dados.favorito
        };

        fetch(URL_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(novoJogo)
        })
            .then(resposta => {
                if (resposta.status != 201) throw new Error("Erro ao cadastrar jogo");
                return resposta.json();
            })
            .then(resultado => {
                console.log("[JOGO CADASTRADO COM SUCESSO!]", resultado);
                criarCardRegistro(novoJogo);
            })
            .catch(erro => console.error(erro));

        formulario.reset();
    }

    carregarJogosSalvos();
    carregarPlataformas();
   
</script>

</html>
